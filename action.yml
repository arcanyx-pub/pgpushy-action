name: pgpushy
description: Plan and apply Postgres schema changes with pgpushy, including the plan-artifact deployment flow.
author: Arcanyx

branding:
  icon: database
  color: blue

inputs:
  command:
    description: |
      What to run: setup, validate, generate-check, plan or apply.

      `setup` installs the binary and stops, for a workflow that wants to call
      pgpushy itself. The other four are the CLI's own commands, with
      `generate-check` spelling `pgpushy generate --check`.
    required: true
  version:
    description: |
      Not an input of this action: which pgpushy runs is pinned by the action
      itself, in pgpushy.pin, together with the SHA-256 of each of that
      release's binaries. Any value is refused, before anything is downloaded.

      Declared only so that it can be refused by name. A composite action is
      never handed an input it does not declare, so an undeclared `version`
      would reach nothing here and the workflow would run a pgpushy release its
      author did not choose, behind a runner warning that is easy to miss in a
      green log. See "Upgrading from v1" in the README.
    required: false
  env:
    description: |
      Which `[env.<name>]` block in pgpushy.toml to reconcile against.

      Required for `plan` and `apply`, and rejected for the rest: `validate`
      and `generate` connect to nothing, and the CLI refuses `--env` there
      rather than ignoring it (spec §10.2).
    required: false
  config:
    description: |
      Path to pgpushy.toml, relative to `working-directory`. Passed as
      `--config`, which selects a whole project: paths inside the file resolve
      against the file's own directory, not against the working directory.
    required: false
  working-directory:
    description: Directory to run pgpushy in. Defaults to the workspace root.
    required: false
    default: "."
  plan-out:
    description: |
      Where `plan` writes its artifact — the manifest, one plan per managed
      schema, and summary.json (spec §8.9). Relative to `working-directory`.
      Upload it, review it, and apply exactly it with the `plan` input.

      Optional: a plan with no `plan-out` still writes an artifact, into the
      runner's temp directory, because summary.json is where the `destructive`
      output and the pull-request comment come from.
    required: false
  plan:
    description: |
      A plan artifact for `apply` to apply exactly, passed as `--plan`.
      Relative to `working-directory`.

      The apply order, the plans and the seeds all live in the artifact, so
      this needs no source tree — which is the point of the artifact: what
      gets applied is what was reviewed, not what the tree says now. It does
      still need a pgpushy.toml, because `env` names a block in one.
    required: false
  comment:
    description: |
      For `plan`: upsert the plan onto the pull request as a comment, one per
      environment, edited in place rather than appended to.

      Needs `permissions: pull-requests: write` on the job. Has no effect on
      any event but `pull_request`, and says so.
    required: false
    default: "false"
  on-destructive:
    description: |
      For `plan`: what a destructive plan does to this step. `fail` (the
      default) fails it; `continue` succeeds, with `exit-code` still 2 and
      `destructive` still true, so a workflow can route on the finding without
      `continue-on-error`.

      Exit 1 fails the step either way. That is the point: `continue-on-error`
      swallows a refused plan and a destructive one alike, and spec §9.1 makes
      them route to different people.

      This is not `allow_destructive`. pgpushy still exits 2, the artifact
      still records every destructive step, and nothing is applied.

      What it does change is what the step's failure was gating: a plan job
      that succeeds is one whose artifact uploads and whose `needs:`
      dependents run. A workflow that sets this puts that gate back on the
      `destructive` output.
    required: false
    default: fail
  password-command:
    description: |
      For `plan` and `apply`: a command whose standard output is the target's
      password, minted here rather than passed in as `PGPASSWORD`.

      For a credential the job computes rather than stores — an RDS IAM auth
      token, an OIDC exchange, anything minted during the run. Such a value has
      never been through a secret store, so nothing masks it, and this action's
      mask step runs after the step that would have minted it. Minting here
      puts the mask on the value before it exists anywhere else, and keeps it
      out of `GITHUB_ENV`, which applies to every later step and third-party
      action in the job.

      Run with `bash --noprofile --norc -eo pipefail -c`, in
      `working-directory`, with the job's environment — so an AWS or gcloud CLI
      sees its credentials. It is your own text at your own trust level, the
      same as a `run:` step, which is another reason never to run this action
      on `pull_request_target`.

      Standard output is the password with one trailing newline stripped. A
      result that is empty, shorter than eight characters, or still carrying a
      newline or a carriage return, a non-zero exit, and a command unfinished
      after 60 seconds are each refused by name, without the value.

      Standard error passes through to the log untouched, which is where a
      minting CLI's own errors are — and it is *not* masked, because at that
      moment nothing is masked yet. Never give the minter a debug or verbose
      flag: a CLI that echoes the credential it just minted puts it in the log
      in full, permanently.

      Refused together with a non-empty `PGPASSWORD`: one source of truth. And
      refused for `setup`, `validate` and `generate-check`, which connect to
      nothing — on `setup` the only way to hand the value onward would be
      `GITHUB_ENV`, which is the thing this input exists to avoid.
    required: false
  plan-password-command:
    description: |
      The same, for an external plan database's password
      (`PGPUSHY_PLAN_PASSWORD`, spec §10.4) — a separate server with separate
      credentials, so a separate command.

      Refused together with a non-empty `PGPUSHY_PLAN_PASSWORD`.
    required: false
  token:
    description: Token used to post the plan comment, and only for that.
    required: false
    default: ${{ github.token }}

outputs:
  exit-code:
    description: |
      pgpushy's exit code: 0 success, 1 refused, 2 a valid plan that would
      destroy something (spec §9.1). Set whatever the code is, including when
      the step then fails on it — but a caller reading it after a non-zero
      code needs `continue-on-error: true` on this step, or an `if: always()`
      on the step doing the reading.
    value: ${{ steps.pgpushy.outputs.exit-code }}
  destructive:
    description: |
      `true` or `false` for `plan`, empty for everything else. Read from the
      artifact's summary.json; a plan that was refused outright wrote no
      artifact and nothing was classified, so it reports `false`.
    value: ${{ steps.pgpushy.outputs.destructive }}
  pgpushy-path:
    description: Absolute path of the installed binary. It is also on PATH.
    value: ${{ steps.install.outputs.pgpushy-path }}
  pgpushy-version:
    description: |
      The pinned pgpushy release this action installed, read from pgpushy.pin.
      A workflow that wants which pgpushy ran in its log, or in an assertion,
      reads it here.
    value: ${{ steps.install.outputs.pgpushy-version }}

# A composite action: fetching one binary and running it is not worth a
# container pull, and there is no reason to make a repository that uses a Rust
# CLI carry a Node runtime to invoke it. The shell lives in scripts/ rather
# than inline so that shellcheck and a local terminal can both reach it.
runs:
  using: composite
  steps:
    # Before the network: the combinations this action refuses are refusals
    # the CLI would also make, and making them here means the first line of a
    # failed run says which input was wrong.
    - name: Check the inputs
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/inputs.sh"'
      env:
        COMMAND: ${{ inputs.command }}
        VERSION: ${{ inputs.version }}
        PGPUSHY_ENV: ${{ inputs.env }}
        CONFIG: ${{ inputs.config }}
        PLAN_OUT: ${{ inputs.plan-out }}
        PLAN: ${{ inputs.plan }}
        COMMENT: ${{ inputs.comment }}
        ON_DESTRUCTIVE: ${{ inputs.on-destructive }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        PASSWORD_COMMAND: ${{ inputs.password-command }}
        PLAN_PASSWORD_COMMAND: ${{ inputs.plan-password-command }}

    # Before the first thing that could log one. PGPASSWORD and
    # PGPUSHY_PLAN_PASSWORD are read from the job's environment, not from an
    # input, and a password the job minted in a step of its own has never been
    # through a secret store that could mask it. This step covers what the job
    # arrives with; a password `password-command` mints is masked by the mint
    # step below, at the moment it comes into existence.
    - name: Mask the passwords
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/mask.sh"'

    # The version and the hash both come from pgpushy.pin, so this step needs
    # no input: what it installs is a property of the action's own ref.
    - name: Install pgpushy
      id: install
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/install.sh"'

    # After the download, and immediately before the step that uses it: a
    # minted credential is short-lived — an RDS auth token lasts fifteen
    # minutes — and neither that lifetime nor the window in which the value
    # sits on disk should be spent fetching a binary. The value is masked
    # inside the script, at the moment it comes into existence, and reaches the
    # run step through a 0600 file in the runner's temp directory: a composite
    # step has no way to hand a sibling step an environment variable except
    # GITHUB_ENV, and GITHUB_ENV would carry the password to every step after
    # this action, which is the thing this input exists to avoid. Each file is
    # deleted by the step that reads it, and again by the last step here
    # whatever the outcome.
    - name: Mint the target password
      if: inputs.password-command != ''
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/mint.sh"'
      env:
        INPUT_NAME: password-command
        VAR_NAME: PGPASSWORD
        MINT_COMMAND: ${{ inputs.password-command }}
        PASSWORD_FILE: ${{ runner.temp }}/pgpushy-action-password
        WORKING_DIRECTORY: ${{ inputs.working-directory }}

    - name: Mint the plan database's password
      if: inputs.plan-password-command != ''
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/mint.sh"'
      env:
        INPUT_NAME: plan-password-command
        VAR_NAME: PGPUSHY_PLAN_PASSWORD
        MINT_COMMAND: ${{ inputs.plan-password-command }}
        PASSWORD_FILE: ${{ runner.temp }}/pgpushy-action-plan-password
        WORKING_DIRECTORY: ${{ inputs.working-directory }}

    # Fails only on the action's own errors, never on pgpushy's exit code.
    # That code is the contract (spec §9.1) and has to reach the caller as an
    # output whatever it is, so failing on it is the last step's job.
    - name: Run pgpushy
      id: pgpushy
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/run.sh"'
      env:
        COMMAND: ${{ inputs.command }}
        VERSION: ${{ inputs.version }}
        PGPUSHY_ENV: ${{ inputs.env }}
        CONFIG: ${{ inputs.config }}
        PLAN_OUT: ${{ inputs.plan-out }}
        PLAN: ${{ inputs.plan }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        # The commands say whether a minted password is expected at all; the
        # paths are where the minting steps put them.
        PASSWORD_COMMAND: ${{ inputs.password-command }}
        PLAN_PASSWORD_COMMAND: ${{ inputs.plan-password-command }}
        PASSWORD_FILE: ${{ runner.temp }}/pgpushy-action-password
        PLAN_PASSWORD_FILE: ${{ runner.temp }}/pgpushy-action-plan-password

    # Every plan, with no input to turn it off, and before the comment so that
    # a token that cannot post still leaves the plan somewhere readable. A run
    # on a push or a schedule has no pull request to comment on, and its plan
    # would otherwise be in the log only.
    - name: Write the plan to the step summary
      if: inputs.command == 'plan'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/summary.sh"'
      env:
        PGPUSHY_ENV: ${{ inputs.env }}
        EXIT_CODE: ${{ steps.pgpushy.outputs.exit-code }}
        LOG_FILE: ${{ steps.pgpushy.outputs.log-file }}
        PLAN_DIR: ${{ steps.pgpushy.outputs.plan-dir }}

    # Runs whatever pgpushy exited with, because a destructive or refused plan
    # is the plan most worth putting in front of a reviewer.
    - name: Comment the plan on the pull request
      if: inputs.command == 'plan' && inputs.comment == 'true'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/comment.sh"'
      env:
        COMMENT: ${{ inputs.comment }}
        PGPUSHY_ENV: ${{ inputs.env }}
        EXIT_CODE: ${{ steps.pgpushy.outputs.exit-code }}
        LOG_FILE: ${{ steps.pgpushy.outputs.log-file }}
        PLAN_DIR: ${{ steps.pgpushy.outputs.plan-dir }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ inputs.token }}

    # The step fails when pgpushy did, exit 2 included: a destructive plan
    # stops a pipeline by default. `on-destructive: continue` is how a workflow
    # that would rather route on that finding than stop on it says so, and it
    # leaves exit 1 fatal.
    - name: Exit with pgpushy's exit code
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/exit.sh"'
      env:
        EXIT_CODE: ${{ steps.pgpushy.outputs.exit-code }}
        COMMAND: ${{ inputs.command }}
        ON_DESTRUCTIVE: ${{ inputs.on-destructive }}

    # Last, and on every outcome. The run step deletes each minted password as
    # it reads it, and this covers the runs that never reached it: a step that
    # failed in between leaves everything after it skipped, and a file holding
    # a live credential would sit in the runner's temp directory for the rest
    # of the job.
    - name: Delete any minted password
      if: always()
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/clean-passwords.sh"'
      env:
        PASSWORD_FILE: ${{ runner.temp }}/pgpushy-action-password
        PLAN_PASSWORD_FILE: ${{ runner.temp }}/pgpushy-action-plan-password
