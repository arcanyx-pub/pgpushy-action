name: pgpushy
description: Plan and apply Postgres schema changes with pgpushy, including the plan-artifact deployment flow.
author: Arcanyx

branding:
  icon: database
  color: blue

inputs:
  command:
    description: |
      What to run: setup, validate, generate-check, plan or apply.

      `setup` installs the binary and stops, for a workflow that wants to call
      pgpushy itself. The other four are the CLI's own commands, with
      `generate-check` spelling `pgpushy generate --check`.
    required: true
  env:
    description: |
      Which `[env.<name>]` block in pgpushy.toml to reconcile against.

      Required for `plan` and `apply`, and rejected for the rest: `validate`
      and `generate` connect to nothing, and the CLI refuses `--env` there
      rather than ignoring it (spec §10.2).
    required: false
  config:
    description: |
      Path to pgpushy.toml, relative to `working-directory`. Passed as
      `--config`, which selects a whole project: paths inside the file resolve
      against the file's own directory, not against the working directory.
    required: false
  working-directory:
    description: Directory to run pgpushy in. Defaults to the workspace root.
    required: false
    default: "."
  plan-out:
    description: |
      Where `plan` writes its artifact — the manifest, one plan per managed
      schema, and summary.json (spec §8.9). Relative to `working-directory`.
      Upload it, review it, and apply exactly it with the `plan` input.

      Optional: a plan with no `plan-out` still writes an artifact, into the
      runner's temp directory, because summary.json is where the `destructive`
      output and the pull-request comment come from.
    required: false
  plan:
    description: |
      A plan artifact for `apply` to apply exactly, passed as `--plan`.
      Relative to `working-directory`.

      The apply order, the plans and the seeds all live in the artifact, so
      this needs no source tree — which is the point of the artifact: what
      gets applied is what was reviewed, not what the tree says now. It does
      still need a pgpushy.toml, because `env` names a block in one.
    required: false
  comment:
    description: |
      For `plan`: upsert the plan onto the pull request as a comment, one per
      environment, edited in place rather than appended to.

      Needs `permissions: pull-requests: write` on the job. Has no effect on
      any event but `pull_request`, and says so.
    required: false
    default: "false"
  on-destructive:
    description: |
      For `plan`: what a destructive plan does to this step. `fail` (the
      default) fails it; `continue` succeeds, with `exit-code` still 2 and
      `destructive` still true, so a workflow can route on the finding without
      `continue-on-error`.

      Exit 1 fails the step either way. That is the point: `continue-on-error`
      swallows a refused plan and a destructive one alike, and spec §9.1 makes
      them route to different people.

      This is not `allow_destructive`. pgpushy still exits 2, the artifact
      still records every destructive step, and nothing is applied.

      What it does change is what the step's failure was gating: a plan job
      that succeeds is one whose artifact uploads and whose `needs:`
      dependents run. A workflow that sets this puts that gate back on the
      `destructive` output.
    required: false
    default: fail
  token:
    description: Token used to post the plan comment, and only for that.
    required: false
    default: ${{ github.token }}

outputs:
  exit-code:
    description: |
      pgpushy's exit code: 0 success, 1 refused, 2 a valid plan that would
      destroy something (spec §9.1). Set whatever the code is, including when
      the step then fails on it — but a caller reading it after a non-zero
      code needs `continue-on-error: true` on this step, or an `if: always()`
      on the step doing the reading.
    value: ${{ steps.pgpushy.outputs.exit-code }}
  destructive:
    description: |
      `true` or `false` for `plan`, empty for everything else. Read from the
      artifact's summary.json; a plan that was refused outright wrote no
      artifact and nothing was classified, so it reports `false`.
    value: ${{ steps.pgpushy.outputs.destructive }}
  pgpushy-path:
    description: Absolute path of the installed binary. It is also on PATH.
    value: ${{ steps.install.outputs.pgpushy-path }}
  pgpushy-version:
    description: |
      The pgpushy release this action installs, e.g. 0.3.2 — read from
      pgpushy.pin, which also carries the SHA-256 of each of that release's
      four binaries.

      Which pgpushy runs is a property of the action version, not an input: the
      end-to-end tests here exercise exactly one pgpushy, and an input would
      let a workflow ask for a version nothing has tested this action against.
      A workflow pins pgpushy by pinning the action, and reads this output to
      record or assert what it got.
    value: ${{ steps.install.outputs.pgpushy-version }}

# A composite action: fetching one binary and running it is not worth a
# container pull, and there is no reason to make a repository that uses a Rust
# CLI carry a Node runtime to invoke it. The shell lives in scripts/ rather
# than inline so that shellcheck and a local terminal can both reach it.
runs:
  using: composite
  steps:
    # Before the network: the combinations this action refuses are refusals
    # the CLI would also make, and making them here means the first line of a
    # failed run says which input was wrong.
    - name: Check the inputs
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/inputs.sh"'
      env:
        COMMAND: ${{ inputs.command }}
        PGPUSHY_ENV: ${{ inputs.env }}
        CONFIG: ${{ inputs.config }}
        PLAN_OUT: ${{ inputs.plan-out }}
        PLAN: ${{ inputs.plan }}
        COMMENT: ${{ inputs.comment }}
        ON_DESTRUCTIVE: ${{ inputs.on-destructive }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}

    # Before the first thing that could log one. PGPASSWORD and
    # PGPUSHY_PLAN_PASSWORD are read from the job's environment, not from an
    # input, and a password minted during the run has never been through a
    # secret store that could mask it.
    - name: Mask the passwords
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/mask.sh"'

    # The version and the hash both come from pgpushy.pin, so this step needs
    # no input: what it installs is a property of the action's own ref.
    - name: Install pgpushy
      id: install
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/install.sh"'

    # Fails only on the action's own errors, never on pgpushy's exit code.
    # That code is the contract (spec §9.1) and has to reach the caller as an
    # output whatever it is, so failing on it is the last step's job.
    - name: Run pgpushy
      id: pgpushy
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/run.sh"'
      env:
        COMMAND: ${{ inputs.command }}
        PGPUSHY_ENV: ${{ inputs.env }}
        CONFIG: ${{ inputs.config }}
        PLAN_OUT: ${{ inputs.plan-out }}
        PLAN: ${{ inputs.plan }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}

    # Every plan, with no input to turn it off, and before the comment so that
    # a token that cannot post still leaves the plan somewhere readable. A run
    # on a push or a schedule has no pull request to comment on, and its plan
    # would otherwise be in the log only.
    - name: Write the plan to the step summary
      if: inputs.command == 'plan'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/summary.sh"'
      env:
        PGPUSHY_ENV: ${{ inputs.env }}
        EXIT_CODE: ${{ steps.pgpushy.outputs.exit-code }}
        LOG_FILE: ${{ steps.pgpushy.outputs.log-file }}
        PLAN_DIR: ${{ steps.pgpushy.outputs.plan-dir }}

    # Runs whatever pgpushy exited with, because a destructive or refused plan
    # is the plan most worth putting in front of a reviewer.
    - name: Comment the plan on the pull request
      if: inputs.command == 'plan' && inputs.comment == 'true'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/comment.sh"'
      env:
        COMMENT: ${{ inputs.comment }}
        PGPUSHY_ENV: ${{ inputs.env }}
        EXIT_CODE: ${{ steps.pgpushy.outputs.exit-code }}
        LOG_FILE: ${{ steps.pgpushy.outputs.log-file }}
        PLAN_DIR: ${{ steps.pgpushy.outputs.plan-dir }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ inputs.token }}

    # The step fails when pgpushy did, exit 2 included: a destructive plan
    # stops a pipeline by default. `on-destructive: continue` is how a workflow
    # that would rather route on that finding than stop on it says so, and it
    # leaves exit 1 fatal.
    - name: Exit with pgpushy's exit code
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/exit.sh"'
      env:
        EXIT_CODE: ${{ steps.pgpushy.outputs.exit-code }}
        COMMAND: ${{ inputs.command }}
        ON_DESTRUCTIVE: ${{ inputs.on-destructive }}
